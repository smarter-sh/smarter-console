<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smarter</title>

    <!--
      the splash, which the browser paints from this page alone, before anything else loads: inline, with no image,
      font or script of its own, so that it shows at once even on a slow network. src/lib/splash.ts fades it out once
      the console is ready. Nothing below holds back this first paint: the stylesheets load without blocking it
      (media="print", then "all" once loaded), and the translations' script is deferred.
    -->
    <style>
      #smarter-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: radial-gradient(ellipse at center, #1c1f27 0%, #0f1014 70%);
        color: #f5f5f7;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        transition: opacity 300ms ease;
      }
      #smarter-splash.smarter-splash-done {
        opacity: 0;
        pointer-events: none;
      }
      .smarter-splash-title {
        padding: 0 16px;
        text-align: center;
      }
      .smarter-splash-name {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        white-space: nowrap;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      /* an orange line on either side of the name, drawn, so that screen readers don't read it. */
      .smarter-splash-name::before,
      .smarter-splash-name::after {
        content: "";
        flex: none;
        width: 36px;
        height: 3px;
        border-radius: 2px;
        background: rgb(255, 87, 51);
      }
      /*
        the tagline fades in 1.5 seconds after the splash first paints, once there's time to read it: on a fast
        network, the splash is gone by then (src/lib/splash.ts, SPLASH_MIN_MS). It keeps its space meanwhile, so
        that the name doesn't move.
      */
      .smarter-splash-tagline {
        margin-top: 10px;
        font-size: 16px;
        letter-spacing: 0.01em;
        color: rgba(245, 245, 247, 0.62);
        opacity: 0;
        animation: smarter-splash-reveal 500ms ease 1500ms forwards;
      }
      @keyframes smarter-splash-reveal {
        to {
          opacity: 1;
        }
      }
      .smarter-splash-spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: rgb(255, 87, 51);
        border-radius: 50%;
        animation: smarter-splash-spin 0.9s linear infinite;
      }
      @keyframes smarter-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* a phone: the name stays on one line, with shorter lines beside it. */
      @media (max-width: 480px) {
        .smarter-splash-name {
          gap: 12px;
          font-size: 26px;
        }
        .smarter-splash-name::before,
        .smarter-splash-name::after {
          width: 20px;
        }
        .smarter-splash-tagline {
          font-size: 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .smarter-splash-spinner {
          animation-duration: 3s;
        }
        #smarter-splash {
          transition: none;
        }
        .smarter-splash-tagline {
          animation-duration: 1ms;
        }
      }
    </style>

    <!--
      the platform's icons, from the backend's static files, as its templates/base.html links them. Vite's dev server
      proxies /static/ to the backend; in production, the backend rewrites /static/ to its STATIC_URL.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/logo/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/static/images/logo/apple-touch-icon-precomposed.png" />
    <link rel="icon" href="/static/images/logo/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/images/logo/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/logo/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/static/images/logo/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/static/images/logo/favicon-256x256.png" />
    <link rel="manifest" href="/static/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700"
      media="print"
      data-smarter-style
      onload="
        this.media = 'all';
        this.dataset.loaded = '1';
      "
      onerror="this.dataset.loaded = '1'"
    />

    <!--
      the theme's mode, light, dark or system, before the first paint: the theme defines its colors and layout
      variables under [data-bs-theme=light] and [data-bs-theme=dark], so without it they are undefined. The same
      choice, in localStorage, as the backend's templates/base.html.
    -->
    <script>
      (function () {
        var mode = "light";
        try {
          mode = localStorage.getItem("data-bs-theme") || mode;
        } catch (e) {
          // storage may be blocked: keep the default.
        }
        if (mode === "system") {
          mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-bs-theme", mode);
      })();
    </script>

    <!-- the console's theme, served by the backend until the console has its own styles. -->
    <link
      href="/static/assets/plugins/global/plugins.bundle.css"
      rel="stylesheet"
      type="text/css"
      media="print"
      data-smarter-style
      onload="
        this.media = 'all';
        this.dataset.loaded = '1';
      "
      onerror="this.dataset.loaded = '1'"
    />
    <link
      href="/static/assets/css/style.bundle.css"
      rel="stylesheet"
      type="text/css"
      media="print"
      data-smarter-style
      onload="
        this.media = 'all';
        this.dataset.loaded = '1';
      "
      onerror="this.dataset.loaded = '1'"
    />

    <!--
      the messages in the session's language: defines window.django.gettext(), which @smarter/common's i18n calls.
      Deferred, it still runs before the console's script, which comes after it.
    -->
    <script defer src="/jsi18n/"></script>
  </head>
  <body>
    <div id="smarter-splash" role="status" aria-label="Loading Smarter">
      <div class="smarter-splash-title">
        <div class="smarter-splash-name">The Smarter Project</div>
        <div class="smarter-splash-tagline">An open source, no-code AI authoring platform.</div>
      </div>
      <div class="smarter-splash-spinner"></div>
    </div>
    <div id="smarter-console-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
