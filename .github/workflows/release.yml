name: Release

#------------------------------------------------------------------------------
# After the Tests workflow passes on a push to main, alpha or beta,
# semantic-release decides from the commits whether there is a release. If
# there is, it builds the console, packs dist/react/ as
# smarter-console-<version>.tar.gz, attaches it to the GitHub release, and
# commits the changelog and the console's version. See release.config.js.
#
# The smarter repository pins a release, and its Docker build downloads that
# release's tarball.
#
# A PAT secret, when the repository has one, lets semantic-release push its
# commit to a protected branch; otherwise the workflow's own token is used.
# semantic-release's own commit, chore(release): <version>, releases nothing.
#------------------------------------------------------------------------------
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main, alpha, beta]

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Used only when there is no PAT secret: semantic-release then works with this token.
    permissions:
      contents: write # pushes the release commit and tag, and creates the GitHub release
      issues: write # comments on the issues a release resolves
      pull-requests: write # comments on the pull requests a release includes
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci --include=dev

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@ba330626c4750c19d8299de843f05c7aa5574f62 # v5.0.2
        id: semantic
        # The plugins' majors are the smarter repository's (its package.json). The
        # latest conventional-changelog-conventionalcommits needs a newer
        # conventional-changelog-writer than the action's semantic-release
        # bundles, and fails with Missing helper.
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@9
            @semantic-release/changelog@7
            @semantic-release/exec@7
            @semantic-release/git@11
          # A workflow_run's GITHUB_REF and GITHUB_SHA are the default branch's, and semantic-release (env-ci) reads
          # its branch from them on GitHub Actions: on alpha or beta it would then take itself for main, and fail with
          # "git tag --merged main: malformed object name main". The runner's GITHUB_* variables can't be overridden
          # in env:, so this unsets GITHUB_ACTIONS: env-ci then reads the branch from the checkout above, which is the
          # branch Tests passed on. CI stays set, so this is still a CI run and not a dry run.
          unset_gha_env: true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com

      - name: Summary
        run: |
          {
            echo "### Release"
            echo "- Branch: ${{ github.event.workflow_run.head_branch }}"
            echo "- Last release: ${{ steps.semantic.outputs.last_release_version || 'none' }}"
            echo "- New release: ${{ steps.semantic.outputs.new_release_version || 'none' }}"
          } >> "$GITHUB_STEP_SUMMARY"
