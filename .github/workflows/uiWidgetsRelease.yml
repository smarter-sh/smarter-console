#------------------------------------------------------------------------------
# Publish @smarter.sh/ui-widgets (packages/smarter.sh-widgets) to npm, when
# semantic-release publishes a GitHub release of this repository (release.yml),
# or by hand for such a release's tag.
#
# - The package's version is the console's: the release's tag, without its v,
#   as for @smarter.sh/ui-chat (uiChatRelease.yml). Until 1.0, it was the
#   Smarter platform's (0.x), when the package was published from
#   smarter-sh/smarter.
# - A release from main is published with the latest dist-tag, and one from
#   another branch with the next dist-tag. A prerelease (1.2.0-alpha.1) is
#   published with its channel's dist-tag, alpha or beta.
# - Checks out the release's tag, runs the package's unit tests, builds the
#   library, checks the package (npm run check:dist), then publishes that same
#   dist/.
# - Publishes only a release that changes the package, or the packages it
#   bundles (@smarter/common, @smarter/didyouknow). The changes job finds the
#   version that npm has on the release's dist-tag and compares that version's
#   tag with this one in those folders. If nothing there changed, the publish
#   job is skipped. A manual run with force publishes regardless. A version
#   that has no tag in this repository, such as the 0.x versions published
#   from smarter, or a dist-tag that npm doesn't have yet, is published.
#
# Publishing uses npm's trusted publishing (OIDC): no npm token is stored in
# the repository, and every version gets a provenance statement. Configure it
# on npmjs.com: @smarter.sh/ui-widgets → Settings → Trusted publisher → GitHub
# Actions, repository smarter-sh/smarter-console, workflow
# uiWidgetsRelease.yml, environment npm.
#
# release.yml's semantic-release uses the PAT secret, not GITHUB_TOKEN, so the
# release that it creates triggers this workflow.
#------------------------------------------------------------------------------
name: Release @smarter.sh/ui-widgets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, e.g. v1.2.0 or v1.2.0-alpha.1"
        required: true
        type: string
      force:
        description: "Publish even if the package didn't change since the last publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish-ui-widgets
  cancel-in-progress: false

jobs:
  # Whether this release changes the package, and the version and dist-tag to
  # publish it with.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      publish: ${{ steps.changes.outputs.publish }}
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TAG }}
          # The whole history and every tag: to check whether the tag is on
          # main, and to compare it with the last published version's tag.
          fetch-depth: 0
          persist-credentials: false

      # main's releases are 1.2.0, and alpha's and beta's are
      # 1.2.0-alpha.1 and 1.2.0-beta.2. A release that isn't on main, such as
      # next's, gets the next dist-tag. Anything else isn't published.
      - name: Version and dist-tag
        id: version
        shell: bash
        run: |
          version="${TAG#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if git merge-base --is-ancestor "refs/tags/$TAG" origin/main; then
              dist_tag=latest
            else
              dist_tag=next
            fi
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$ ]]; then
            dist_tag="${BASH_REMATCH[1]}"
          else
            echo "::error::$TAG is not a release (v1.2.3) or an alpha or beta prerelease (v1.2.3-alpha.4)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Version $version, dist-tag $dist_tag"

      # git diff compares the two tags' trees, so it works across branches,
      # e.g. from 1.2.7-alpha.1 to 1.2.8-alpha.1 after a merge from main.
      - name: Changes since the last publish
        id: changes
        shell: bash
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          FORCE: ${{ inputs.force || false }}
        run: |
          paths=(packages/smarter.sh-widgets packages/smarter-common packages/smarter-didyouknow)
          published="$(npm view @smarter.sh/ui-widgets "dist-tags.$DIST_TAG" 2>/dev/null || true)"
          if [[ "$FORCE" == "true" ]]; then
            publish=true
            reason="the run was started with force"
          elif [[ -z "$published" ]]; then
            publish=true
            reason="npm has no $DIST_TAG version"
          elif ! git rev-parse -q --verify "refs/tags/v$published" >/dev/null; then
            publish=true
            reason="the $DIST_TAG version, $published, has no tag in this repository"
          elif git diff --quiet "refs/tags/v$published" "refs/tags/$TAG" -- "${paths[@]}"; then
            publish=false
            reason="nothing changed since $published, the $DIST_TAG version"
          else
            publish=true
            reason="changed since $published, the $DIST_TAG version"
            git diff --stat "refs/tags/v$published" "refs/tags/$TAG" -- "${paths[@]}"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "publish=$publish: $reason"
          if [[ "$publish" == "false" ]]; then
            {
              echo "### Skipped @smarter.sh/ui-widgets@${TAG#v}"
              echo ""
              echo "Not published: $reason, in ${paths[*]}."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing and provenance.
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci --include=dev

      # The library bundles @smarter/common's gettext() and @smarter/didyouknow's
      # facts, from their builds.
      - name: Build @smarter/common and @smarter/didyouknow
        run: |
          npm run build --workspace=@smarter/common
          npm run build:lib --workspace=@smarter/didyouknow

      - name: Unit tests
        run: npx vitest run --project smarter.sh-widgets

      - name: Build and check
        env:
          NODE_ENV: production
        run: |
          npm run build:lib --workspace=@smarter.sh/ui-widgets
          npm run check:dist --workspace=@smarter.sh/ui-widgets

      # npm pkg set only edits package.json. npm version would also update the
      # workspace. The committed version is a placeholder,
      # 9999.9999.9999.dev9999, which the apps' dependency, *, accepts.
      - name: Set the package's version
        working-directory: packages/smarter.sh-widgets
        run: npm pkg set version="${{ needs.changes.outputs.version }}"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1 && npm --version

      # --ignore-scripts: publish the dist/ that was just checked.
      - name: Publish to npm
        working-directory: packages/smarter.sh-widgets
        run: npm publish --ignore-scripts --access public --provenance --tag "${{ needs.changes.outputs.dist_tag }}"

      - name: Summary
        shell: bash
        run: |
          version="${{ needs.changes.outputs.version }}"
          {
            echo "### Published @smarter.sh/ui-widgets@$version"
            echo ""
            echo "- npm: https://www.npmjs.com/package/@smarter.sh/ui-widgets/v/$version (dist-tag ${{ needs.changes.outputs.dist_tag }})"
          } >> "$GITHUB_STEP_SUMMARY"
